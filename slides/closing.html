<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thank You</title>
<link rel="stylesheet" href="style/eweb.css">
<link rel="stylesheet" href="style/fin.css">
<style>
  h1{font-size:92px;line-height:.94;letter-spacing:-3.8px;margin-top:108px}
  .sub{font-size:20px;max-width:500px;margin-top:26px}
  .cta{margin-top:34px;display:flex;gap:16px;align-items:center}
  #hero{left:600px;top:0;width:680px;height:720px}
</style>
</head>
<body data-foot="Trade surveillance · Thank you">
<div class="z">
  <div class="eyebrow in1">Elastic Security · <b>Financial services</b></div>
  <h1 class="in2">One platform.<br><span class="b">Every risk.</span></h1>
  <p class="sub in3">Market abuse, fraud and cyber defense on one data model. Tell a story with your data.</p>
  <div class="cta in4"><a class="btn fill" href="https://www.elastic.co/security" target="_blank" rel="noopener" style="text-decoration:none;pointer-events:auto;cursor:pointer;position:relative;z-index:6">elastic.co/security&nbsp;&nbsp;↗</a></div>
</div>
<svg id="hero" class="iso" viewBox="0 0 680 720"></svg>
<script src="style/eweb.js"></script>
<script src="style/fin.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  EW.dots({x: 640, y: 30, w: 640, h: 660, seed: 4, blobs: 6, thr: .5});
  const sc = EW.iso(document.getElementById('hero'), {ox: 300, oy: 300, s: .8});
  sc.rect({x: -30, y: -30, w: 330, d: 330, z: 0, delay: .05, dash: '2 4'});
  sc.box({x: 0, y: 0, w: 270, d: 270, h: 46, c: 'blue', delay: .1, drop: 60, snap: false, order: -1000});
  FIN.candles(sc, {delay: .3, gap: .05});
  // the flagged order is resolved: it is now a calm teal cube
  sc.box({x: 190, y: 26, w: 60, d: 60, h: 76, z: 46, c: 'teal', delay: .5, drop: 50, order: 70});
  sc.box({x: 72, y: 34, w: 80, d: 80, h: 80, z: 46, c: 'pink', delay: .7, drop: 150, order: 50});
  sc.box({x: 60, y: 22, w: 104, d: 104, h: 104, z: 46, c: 'glass', wire: true, inner: true, stroke: '#343741', delay: .95, drop: 0, snap: false, order: 60});
  sc.label({at: [164, 22, 46 + 90], side: 'r', len: 50, title: 'Elastic Security', sub: 'Docked', delay: 1.2, raw: true});
  sc.label({at: [14, 252, 46 + 24], side: 'l', len: 60, title: 'Order flow', sub: 'Every signal in', delay: 1.1});
  sc.label({at: [250, 26, 46 + 38], side: 'r', len: 40, title: 'Resolved', sub: 'Alert to case', delay: 1.25});
  sc.label({at: [270, 60, 23], side: 'r', len: 36, title: 'One platform', sub: 'Fraud and cyber', delay: 1.35});
  const [cx, cy] = sc.P(112, 74, 46);
  const ring = EW.el('ellipse', {cx, cy, rx: 10, ry: 5.8, fill: 'none', stroke: '#F04E98', 'stroke-width': 1.2, opacity: 0}, sc.floor);
  sc.run();
  EW.loop(t => {
    if (t < 1.6) return;
    const k = ((t - 1.6) % 2.6) / 2.6;
    ring.setAttribute('rx', 60 + k * 120); ring.setAttribute('ry', (60 + k * 120) * .58); ring.setAttribute('opacity', (1 - k) * .6);
  });
})();
</script>
</body>
</html>
