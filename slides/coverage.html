<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coverage</title>
<link rel="stylesheet" href="style/eweb.css">
<link rel="stylesheet" href="style/fin.css">
<style>
  h1{font-size:48px;letter-spacing:-1.7px}
  .sub{font-size:17px;max-width:800px;margin-top:10px}
  .grid{position:absolute;left:72px;right:72px;top:196px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .c{background:#fff;border:1px solid var(--line);height:196px;padding:16px 16px 14px;display:flex;flex-direction:column;position:relative;animation:fin-up .5s cubic-bezier(.2,.7,.2,1) both;border-top:3px solid var(--ink)}
  .c .top{display:flex;justify-content:space-between;align-items:flex-start}
  .c .ct{font:500 44px/1 var(--sans);letter-spacing:-2px;color:var(--blue)}
  .c .ct small{font:600 10px var(--mono);letter-spacing:.07em;color:var(--grey);text-transform:uppercase;margin-left:6px;letter-spacing:.06em}
  .c svg{width:64px;height:40px;overflow:visible}
  .c h3{font:600 17px/1.2 var(--sans);letter-spacing:-.3px;margin-top:12px}
  .c p{font-size:12.5px;line-height:1.45;color:var(--char);margin-top:5px}
  .c .mitre{margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
  .c.k1{border-top-color:var(--teal-d)} .c.k2{border-top-color:var(--pink)} .c.k3{border-top-color:var(--orange)} .c.k4{border-top-color:var(--blue)}
  .strip{position:absolute;left:72px;right:72px;top:614px;display:flex;gap:10px;align-items:center;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
  .strip b{color:var(--ink)}
</style>
</head>
<body data-foot="Trade surveillance · Coverage">
<div class="z">
  <div class="eyebrow in1">Detection coverage</div>
  <h1 class="in2">Thirteen detections. <span class="b">Eight kinds of market abuse.</span></h1>
  <p class="sub in3">Each is an ES|QL rule over one order index, mapped to MITRE ATT&amp;CK.</p>
</div>
<div class="grid" id="g"></div>
<div class="strip in6"><span>Mapped to ATT&amp;CK:</span><span class="chip"><b>T1565</b>&nbsp;Data Manipulation</span><span class="chip"><b>T1657</b>&nbsp;Financial Theft</span><span class="chip"><b>T1036</b>&nbsp;Masquerading</span></div>
<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  const I = {
    spoof: '<rect x="0" y="6" width="8" height="28" fill="#B5BFCE"/><rect x="14" y="14" width="8" height="20" fill="#B5BFCE"/><rect x="28" y="2" width="8" height="32" fill="#B5BFCE"/><path d="M0 38H60" stroke="#1D1E24"/><path d="M44 6L58 20M58 6L44 20" stroke="#F04E98" stroke-width="2"/>',
    wash: '<path d="M10 20a16 12 0 1 1 8 10" fill="none" stroke="#1D1E24" stroke-width="1.5"/><path d="M14 32L18 30L16 25" fill="none" stroke="#1D1E24" stroke-width="1.5"/><rect x="40" y="10" width="16" height="16" fill="#48EFCF"/>',
    pump: '<path d="M0 34L14 28L24 30L36 14L46 4L54 36" fill="none" stroke="#0B64DD" stroke-width="2"/><circle cx="46" cy="4" r="3" fill="#FF7E62"/>',
    vol: '<rect x="0" y="26" width="8" height="12" fill="#B5BFCE"/><rect x="14" y="22" width="8" height="16" fill="#B5BFCE"/><rect x="28" y="18" width="8" height="20" fill="#B5BFCE"/><rect x="42" y="0" width="8" height="38" fill="#E0352B"/><path d="M0 14H60" stroke="#1D1E24" stroke-dasharray="2 3"/>',
    defi: '<rect x="4" y="22" width="14" height="14" fill="#0B64DD"/><rect x="26" y="4" width="26" height="32" fill="#FF7E62"/>',
    insider: '<path d="M0 30L16 24L30 26L58 6" fill="none" stroke="#1D1E24" stroke-width="1.5"/><path d="M10 38L16 24" stroke="#02BCB7" stroke-width="2"/><circle cx="16" cy="24" r="4" fill="#fff" stroke="#1D1E24" stroke-width="1.5"/>',
    venue: '<rect x="2" y="4" width="26" height="32" fill="#DDE3EC"/><rect x="34" y="4" width="22" height="32" fill="#343741"/>',
    attr: '<circle cx="14" cy="14" r="8" fill="#DDE3EC" stroke="#1D1E24"/><path d="M0 38C0 26 28 26 28 38" fill="#DDE3EC" stroke="#1D1E24"/><text x="38" y="30" font-size="26" font-family="monospace" fill="#E0352B">?</text>'
  };
  const cards = [
    ['k1', 'Spoofing and layering', '2', 'spoof', 'Orders placed to mislead, then cancelled or endlessly amended before any fill.', 'T1565'],
    ['k1', 'Wash trading', '2', 'wash', 'The same account buys and sells near-equal size, so the net position barely moves.', 'T1565'],
    ['k2', 'Pump and dump', '2', 'pump', 'One client accumulates across accounts, then liquidates the position fast.', 'T1657'],
    ['k2', 'Unusual volume', '3', 'vol', 'Symbols far above average daily volume, and brand-new accounts trading at scale.', 'T1565'],
    ['k3', 'DeFi and flash loan', '1', 'defi', 'DAO and treasury accounts suddenly placing oversized single orders.', 'T1565'],
    ['k3', 'Insider trading', '1', 'insider', 'Fills with a price edge too good to be luck, again and again.', 'T1565'],
    ['k4', 'Venue anomaly', '1', 'venue', 'Flow migrating to dark venues to avoid pre-trade transparency.', 'T1036'],
    ['k4', 'Attribution risk', '1', 'attr', 'Accounts where most orders carry no beneficial owner.', 'T1036'],
  ];
  const g = document.getElementById('g');
  cards.forEach(([k, t, n, ic, d, m], i) => {
    const e = document.createElement('div'); e.className = 'c ' + k; e.style.animationDelay = (.35 + i * .09) + 's';
    e.innerHTML = `<div class="top"><div class="ct">${n}<small>${n == 1 ? 'rule' : 'rules'}</small></div><svg viewBox="0 0 60 40">${I[ic]}</svg></div><h3>${t}</h3><p>${d}</p><div class="mitre">ATT&amp;CK <b>${m}</b></div>`;
    g.appendChild(e);
  });
})();
</script>
</body>
</html>
