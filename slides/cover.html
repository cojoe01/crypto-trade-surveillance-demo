<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover</title>
<link rel="stylesheet" href="style/eweb.css">
<link rel="stylesheet" href="style/fin.css">
<style>
  h1{font-size:84px;line-height:.96;letter-spacing:-3.6px;margin-top:132px}
  .sub{font-size:20px;max-width:500px;margin-top:26px}
  .cta{margin-top:30px;display:flex;gap:8px;align-items:center}
  #hero{left:600px;top:0;width:680px;height:720px}
</style>
</head>
<body data-foot="Trade surveillance · 2026">
<div class="z">
  <div class="eyebrow in1">Elastic Security · <b>Financial services</b></div>
  <h1 class="in2">The market is<br>a <span class="b">log source.</span></h1>
  <p class="sub in3">Trade surveillance for a crypto exchange, run on the same platform that defends the enterprise.</p>
  <div class="cta in4"><span class="chip on">Market abuse</span><span class="chip">Fraud</span><span class="chip">Cyber</span></div>
</div>
<svg id="hero" class="iso" viewBox="0 0 720 720"></svg>
<script src="style/eweb.js"></script>
<script src="style/fin.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  EW.dots({x: 640, y: 30, w: 640, h: 560, seed: 4, blobs: 6, thr: .5});
  FIN.ticker();
  const sc = EW.iso(document.getElementById('hero'), {ox: 300, oy: 262, s: .8});
  sc.rect({x: -30, y: -30, w: 330, d: 330, z: 0, delay: .1});
  const plat = sc.box({x: 0, y: 0, w: 270, d: 270, h: 46, c: 'blue', delay: .15, drop: 120, order: -1000});
  FIN.candles(sc, {});
  sc.box({x: 190, y: 26, w: 60, d: 60, h: 76, z: 46, c: FIN.RED, delay: .82, drop: 90});
  const foot = sc.rect({x: 60, y: 22, w: 104, d: 104, z: 46, sw: 1.2, delay: 1.0});
  sc.box({x: 60, y: 22, w: 104, d: 104, h: 104, z: 176, c: 'glass', wire: true, inner: true, stroke: '#343741', delay: 1.05, drop: 60, float: 7, floatSpeed: 1.1, order: 2000});
  sc.box({x: 72, y: 34, w: 80, d: 80, h: 80, z: 188, c: 'pink', delay: 1.1, drop: 80, float: 7, floatSpeed: 1.1, order: 3000});
  sc.label({at: [14, 252, 46 + 24], side: 'l', len: 60, title: 'Order flow', sub: ['Every order, fill', 'and cancel'], delay: 1.3});
  sc.label({at: [164, 22, 176 + 52], side: 'r', len: 50, title: 'Elastic Security', sub: 'Detections as code', delay: 1.45, raw: true});
  sc.label({at: [250, 26, 46 + 38], side: 'r', len: 40, title: 'Flagged order', sub: 'Wash trade, layering', delay: 1.6});
  sc.label({at: [270, 60, 23], side: 'r', len: 36, title: 'One platform', sub: 'Fraud and cyber together', delay: 1.75});
  sc.run();
  const fid = document.querySelector('#hero filter').id;
  const sh = EW.el('polygon', {points: [[70, 32], [158, 32], [158, 120], [70, 120]].map(([x, y]) => sc.P(x, y, 46).join(',')).join(' '), fill: 'rgba(30,40,80,.30)', filter: `url(#${fid})`, opacity: 0});
  plat.g.after(foot.g); foot.g.after(sh);
  const [rx, ry] = sc.P(220, 56, 46);
  const ring = EW.el('ellipse', {cx: rx, cy: ry, rx: 10, ry: 6, fill: 'none', stroke: '#E0352B', 'stroke-width': 1.3, opacity: 0}, sc.floor);
  EW.loop(t => {
    const k = Math.min(1, Math.max(0, (t - 1.1) / .6)), f = t > 1.8 ? Math.sin((t - 1.8) * 1.1) : 0;
    sh.setAttribute('opacity', (k * (.85 - .25 * f)).toFixed(3));
    sh.setAttribute('transform', `translate(${sc.P(114, 76, 46).map(v => v.toFixed(1)).join(',')}) scale(${(1 - .06 * f).toFixed(3)}) translate(${sc.P(114, 76, 46).map(v => (-v).toFixed(1)).join(',')})`);
    if (t > 1.6){ const q = ((t - 1.6) % 2.6) / 2.6, r = 30 + q * 70; ring.setAttribute('rx', r); ring.setAttribute('ry', r * .58); ring.setAttribute('opacity', ((1 - q) * .55).toFixed(3)); }
  });
})();
</script>
</body>
</html>
